<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Call demo</title>
</head>
<body>
    <h1>Making api calls</h1>

    <script>
        let url = "https://catfact.ninja/fact";

        // requesting api using then and catch

        // let promise = fetch(url); // returns promise
        // promise
        //     .then((res) => {
        //         console.log(res); // response object
        //         return res.json(); // returns promise
        //     })
        //     .then((res) => {
        //         console.log(res); // data object
        //         console.log("fact is " + res.fact);
        //     })
        //     .catch((err)=> {
        //         console.log("An Error occured --> " + err);
        //     })

        // requesting api using async and await

        async function requestAPI()  {
            try {
                let res1 = await fetch(url);
                let data1 = await res1.json();
                console.log("data fetched --> " +data1.fact);
                console.log("length is " + data1.length);

                let res2 = await fetch(url);
                let data2 = await res2.json();
                console.log("data fetched --> " +data2.fact);
                console.log("length is " + data2.length);

                let res3 = await fetch(url);
                let data3 = await res3.json();
                console.log("data fetched --> " +data3.fact);
                console.log("length is " + data3.length);
            } catch(err) {
                console.log(err);
            }
        }
        requestAPI();
    </script>
</body>
</html>
